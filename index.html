<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دستیار هوش مصنوعی پارادوکس</title>
  <style>
    :root {
      --neon-orange: #ff6600;
      --glow-orange: rgba(255, 102, 0, 0.4);
      --bg-black: #080808;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: #fff;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .glowing-orb {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 102, 0, 0.25) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      animation: floatOrb 12s infinite ease-in-out alternate;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    @keyframes floatOrb {
      0% { transform: translate(-150px, -150px); }
      100% { transform: translate(50px, 100px); }
    }

    .chat-container {
      width: 90%;
      max-width: 500px;
      height: 80vh;
      background: rgba(15, 15, 15, 0.9);
      border: 2px solid var(--neon-orange);
      box-shadow: 0 0 20px var(--glow-orange);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 1;
      position: relative;
    }

    .header {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--neon-orange);
      color: var(--neon-orange);
      font-weight: bold;
      position: relative;
    }

    /* استایل دکمه خروج */
    .exit-btn {
      position: absolute;
      right: 15px;
      top: 15px;
      background: transparent;
      border: 1px solid var(--neon-orange);
      color: var(--neon-orange);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .exit-btn:hover {
      background: var(--neon-orange);
      color: #000;
    }

    .typing-status {
      font-size: 0.8rem;
      color: #ffaa66;
      height: 15px;
      visibility: hidden;
      margin-top: 5px;
    }

    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .message.bot { align-self: flex-start; background: #222; border: 1px solid var(--neon-orange); }
    .message.user { align-self: flex-end; background: var(--neon-orange); color: #000; font-weight: bold; }

    .input-box {
      padding: 10px;
      border-top: 1px solid var(--neon-orange);
      display: flex;
      gap: 5px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--neon-orange);
      padding: 8px;
      color: #fff;
      border-radius: 5px;
      outline: none;
    }

    button#sendBtn {
      background: var(--neon-orange);
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="glowing-orb"></div>

  <div class="chat-container">
    <div class="header">
      <!-- دکمه خروج اضافه شد -->
      <button class="exit-btn" onclick="window.location.href='index.html'">خروج</button>
      <div>دستیار هوش مصنوعی پارادوکس</div>
      <div id="typingStatus" class="typing-status">در حال تایپ کردن...</div>
    </div>

    <div class="messages-box" id="messagesBox">
      <div class="message bot">سلام! من دستیار پارادوکس هستم. چطور می‌تونم کمکتون کنم؟</div>
    </div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="پیام خود را بنویسید..." autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesBox = document.getElementById('messagesBox');
    const typingStatus = document.getElementById('typingStatus');

    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;
      typingStatus.style.visibility = 'visible';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userMessage: text })
        });
        const data = await response.json();
        
        setTimeout(() => {
          typingStatus.style.visibility = 'hidden';
          appendMessage(data.reply || "خطا در پاسخ", 'bot');
          startCooldown(14);
        }, 5000);
      } catch {
        typingStatus.style.visibility = 'hidden';
        appendMessage("خطای ارتباطی", 'bot');
        userInput.disabled = false;
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function startCooldown(s) {
      let r = s;
      const interval = setInterval(() => {
        r--;
        if (r > 0) userInput.placeholder = `${r} ثانیه تا ارسال بعدی...`;
        else {
          clearInterval(interval);
          userInput.disabled = false;
          sendBtn.disabled = false;
          userInput.placeholder = "پیام خود را بنویسید...";
        }
      }, 1000);
    }
  </script>
</body>
</html>
